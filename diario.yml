name: Resumen diario

on:
  schedule:
    # El cron va en UTC. 06:00 UTC = 07:00 en Madrid en invierno y 08:00 en verano.
    # GitHub puede retrasar la ejecución unos minutos.
    - cron: "0 6 * * *"
  workflow_dispatch:  # permite lanzarlo a mano desde la pestaña Actions

jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python noticias.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
